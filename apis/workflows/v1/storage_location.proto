// The external API for managing storage locations, object access, and notifications.

edition = "2023";

package workflows.v1;

import "buf/validate/validate.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "tilebox/v1/id.proto";
import "tilebox/v1/query.proto";
import "workflows/v1/storage_access.proto";

option features.field_presence = IMPLICIT;

// StorageType identifies the storage provider and resource kind.
enum StorageType {
  STORAGE_TYPE_UNSPECIFIED = 0;
  // Google Cloud Storage bucket
  STORAGE_TYPE_GCS = 1;
  // Amazon Web Services S3 bucket
  STORAGE_TYPE_AWS_S3 = 2;
  // Local directory
  STORAGE_TYPE_LOCAL = 3;
  // Azure Blob Storage container
  STORAGE_TYPE_AZURE_BLOB = 4;
  // Cloudflare R2 bucket
  STORAGE_TYPE_CLOUDFLARE_R2 = 5;
  // Tigris bucket
  STORAGE_TYPE_TIGRIS = 6;
  // Bucket served by another S3-compatible provider
  STORAGE_TYPE_S3_COMPATIBLE = 7;
}

// StorageLocation identifies a bucket, container, or local directory.
message StorageLocation {
  // Unique identifier of the storage location.
  tilebox.v1.ID id = 1;
  // Use reference for the provider coordinates.
  string location = 2 [deprecated = true];
  // Use reference.type for the storage type.
  StorageType type = 3 [deprecated = true];
  // Display name of the storage location.
  string name = 4 [(buf.validate.field).string.max_bytes = 1024];
  // Provider coordinates and optional object access. Responses omit stored credentials.
  StorageLocationReference reference = 5;
}

// StorageLocationReference identifies an existing storage resource. Set the field corresponding to type.
// Coordinates and root_prefix are fixed after creation. A supplied reference replaces the complete access configuration.
// Omitted credential fields keep saved values only when the authentication method is unchanged.
// Creating or switching to a credential-backed method requires a complete pair. Location responses omit credentials.
// Absent access disables Tilebox object access; anonymous and client-managed access must be selected explicitly.
message StorageLocationReference {
  option (buf.validate.message).oneof = {
    fields: [
      "aws_s3_bucket",
      "gcs_bucket",
      "azure_blob",
      "local",
      "s3_compatible_bucket",
      "r2_bucket",
      "tigris_bucket"
    ]
    required: true
  };
  option (buf.validate.message).cel = {
    id: "storage_location_reference.type"
    message: "The storage type must match the provider reference."
    expression: "(this.type == 1 && has(this.gcs_bucket)) || (this.type == 2 && has(this.aws_s3_bucket)) || (this.type == 3 && has(this.local)) || (this.type == 4 && has(this.azure_blob)) || (this.type == 5 && has(this.r2_bucket)) || (this.type == 6 && has(this.tigris_bucket)) || (this.type == 7 && has(this.s3_compatible_bucket))"
  };

  AWSS3BucketReference aws_s3_bucket = 1;
  GCSBucketReference gcs_bucket = 2;
  AzureBlobReference azure_blob = 3;
  LocalReference local = 4;
  StorageType type = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  S3CompatibleBucketReference s3_compatible_bucket = 6;
  R2BucketReference r2_bucket = 7;
  TigrisBucketReference tigris_bucket = 8;
  // Empty for the resource root; otherwise a relative directory prefix ending in '/'.
  // Scopes client paths and subscriptions. Ignore notifications outside this prefix and strip it before matching globs.
  // Delegated credentials enforce the prefix; static and client-managed credentials retain their cloud scope.
  string root_prefix = 9 [
    (buf.validate.field).string.max_bytes = 1024,
    (buf.validate.field).string.not_contains = "\x00",
    (buf.validate.field).cel = {
      id: "storage_location_reference.root_prefix"
      message: "Use an empty root or a relative directory prefix ending in '/' without empty, '.' or '..' components."
      expression: "this == '' || (this.endsWith('/') && !this.startsWith('/') && !this.contains('//') && this.split('/').all(p, p != '.' && p != '..'))"
    }
  ];
}

// S3CompatibleBucketReference identifies a bucket at an S3 endpoint.
message S3CompatibleBucketReference {
  string bucket = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 255
  }];
  // HTTP or HTTPS origin without credentials, path, query, or fragment.
  string endpoint = 2 [(buf.validate.field).string = {
    uri: true
    max_bytes: 2048
    pattern: "^https?://[^/?#@]+/?$"
  }];
  // Region used for SigV4 signing, independent of the endpoint hostname. Empty or omitted defaults to "auto".
  string region = 3 [(buf.validate.field).string.max_bytes = 128];
  bool force_path_style = 4;
  // Public bucket-root origin for anonymous HTTP reads.
  string public_endpoint = 5 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {
      uri: true
      max_bytes: 2048
      pattern: "^https?://[^/?#@]+/?$"
    }
  ];
  S3CompatibleStorageAccess access = 6;
}

// R2BucketReference identifies a Cloudflare R2 bucket.
message R2BucketReference {
  option (buf.validate.message).cel = {
    id: "r2_bucket_reference.endpoint"
    message: "An S3 endpoint is required for delegated, static, or client-managed access."
    expression: "!has(this.access) || has(this.access.anonymous) || this.endpoint != ''"
  };

  string bucket = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 63
  }];
  // Account's R2 S3 endpoint, including its jurisdiction when applicable. Required for S3 access.
  // Signing region is auto.
  string endpoint = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      uri: true
      max_bytes: 2048
      pattern: "^https://[^/?#@]+/?$"
    }
  ];
  R2StorageAccess access = 3;
}

// TigrisBucketReference identifies a Tigris bucket using its standard S3 endpoint.
message TigrisBucketReference {
  string bucket = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 63
  }];
  S3CompatibleStorageAccess access = 2;
}

// AWSS3BucketReference identifies an Amazon Web Services S3 bucket and its region.
message AWSS3BucketReference {
  string bucket = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 63
  }];
  string region = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 128
  }];
  AWSS3StorageAccess access = 3;
}

// GCSBucketReference identifies a Google Cloud Storage bucket and its project.
message GCSBucketReference {
  string bucket = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 222
  }];
  // ID of the Google Cloud project that owns the bucket.
  string project_id = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 128
  }];
  // Optional bucket location, such as europe-west2, EUR4, or EU. May be a region, dual-region, or multi-region.
  string location = 3 [(buf.validate.field).string.max_bytes = 128];
  GCSStorageAccess access = 4;
}

// AzureBlobReference identifies a container in an Azure storage account.
message AzureBlobReference {
  // Full ARM resource ID of the storage account, not its URL or a connection string.
  string storage_account_resource_id = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 2048
  }];
  string container = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 63
  }];
  // Optional primary region of the storage account, such as westeurope. Containers use their account's region.
  string region = 3 [(buf.validate.field).string.max_bytes = 128];
  AzureBlobStorageAccess access = 4;
}

// LocalReference identifies a local directory monitored by the Tilebox CLI.
message LocalReference {
  string path = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 512
  }];
}

// TriggeredJob identifies a job submitted by an automation for a matching object path.
message TriggeredJob {
  tilebox.v1.ID job_id = 1;
  tilebox.v1.ID automation_id = 2;
  string glob_pattern = 3;
}

// TriggeredJobs contains the jobs submitted for an event.
message TriggeredJobs {
  repeated TriggeredJob triggered_jobs = 1;
}

// CreateStorageLocationRequest registers an existing bucket, container, or directory.
// Omit the provider's access field for notification-only use. Cloud permissions can be configured after creation.
message CreateStorageLocationRequest {
  string name = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  StorageLocationReference reference = 2 [(buf.validate.field).required = true];
}

// UpdateStorageLocationRequest changes supplied fields and leaves the rest unchanged.
message UpdateStorageLocationRequest {
  option (buf.validate.message).cel = {
    id: "update_storage_location.fields"
    message: "At least one update field is required."
    expression: "has(this.name) || has(this.reference)"
  };

  tilebox.v1.ID storage_location_id = 1 [(buf.validate.field).required = true];
  string name = 2 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {
      min_bytes: 1
      max_bytes: 1024
    }
  ];
  // Omit to keep the reference. Supply a complete reference with unchanged coordinates and root_prefix to replace access.
  // Credential fields are patched within the same access method: supplied values replace saved values; omitted fields keep them.
  // Omitting access within a supplied reference removes access and saved credentials; issued keys may remain valid.
  StorageLocationReference reference = 3;
}

// StorageSubscriptionType identifies the notification delivery provider.
enum StorageSubscriptionType {
  STORAGE_SUBSCRIPTION_TYPE_UNSPECIFIED = 0;
  // Amazon SNS delivering object notifications from an AWS S3 bucket, or custom SNS message formats configured via message_format.
  STORAGE_SUBSCRIPTION_TYPE_AWS_SNS = 1;
  // Google Cloud Pub/Sub delivering notifications from a GCS bucket.
  STORAGE_SUBSCRIPTION_TYPE_GOOGLE_PUBSUB = 2;
  // Azure Event Grid delivering notifications from an Azure Blob Storage container.
  STORAGE_SUBSCRIPTION_TYPE_AZURE_EVENT_GRID = 3;
  // Storage notifications sent by the Tilebox CLI. Typically for local storage locations. No delivery configuration is required.
  // Use StorageLocationService.NotifyObjectCreated, or POST JSON containing object_path and optional RFC3339 event_time
  // to /v1/storage-notifications/tilebox-cli/<subscription-id>.
  // object_path is relative to the directory root and uses slash separators, without dot or parent components.
  // Authenticate with Authorization: Bearer <api-key>; the organization must manage the storage location.
  // The standalone on-orbit runtime does not require authentication.
  // Successful HTTP deliveries return 204 after jobs and history are committed. Retries can create duplicate jobs.
  STORAGE_SUBSCRIPTION_TYPE_TILEBOX_CLI = 4;
}

// AWSSNSStorageSubscription identifies the SNS topic whose signed notifications are accepted.
// Configure an HTTPS subscription with raw message delivery disabled. Tilebox verifies and confirms signed SNS requests.
message AWSSNSStorageSubscription {
  string topic_arn = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 2048
  }];
  // Payload format: s3, earthsearch_stac, or usgs_landsat_c2. If omitted, s3 is assumed.
  string message_format = 2 [
    (buf.validate.field).string.in = "",
    (buf.validate.field).string.in = "s3",
    (buf.validate.field).string.in = "earthsearch_stac",
    (buf.validate.field).string.in = "usgs_landsat_c2"
  ];
}

// GooglePubSubStorageSubscription identifies the delivery subscription and authenticated push identity.
// Use authenticated push with wrapped JSON and the returned audience.
message GooglePubSubStorageSubscription {
  // Full resource name: projects/{project}/subscriptions/{subscription}.
  string subscription = 1 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 1024
  }];
  // Expected Google-authenticated service account email. No service account key is accepted.
  string service_account_email = 2 [(buf.validate.field).string = {
    email: true
    max_bytes: 320
  }];
  // OIDC audience to configure for authenticated push, equal to the subscription's endpoint.
  string audience = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// AzureEventGridStorageSubscription configures Event Grid delivery with a secret header.
// Subscribe to Microsoft.Storage.BlobCreated with the location's container subject prefix.
// Use Event Grid schema, not CloudEvents schema.
message AzureEventGridStorageSubscription {
  // Delivery header to configure in Event Grid: X-Tilebox-Webhook-Secret.
  string webhook_secret_header = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Secret delivery header value, returned only when the subscription is created.
  // Copy it into Event Grid's secret delivery header configuration; it cannot be retrieved later.
  string webhook_secret = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Server-managed verifier; never returned by the API.
  bytes webhook_secret_hash = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// StorageSubscription receives object notifications for a storage location.
// To change delivery configuration, create a replacement subscription and delete the old one.
message StorageSubscription {
  option (buf.validate.message).oneof = {
    fields: [
      "aws_sns",
      "google_pubsub",
      "azure_event_grid"
    ]
  };
  option (buf.validate.message).cel = {
    id: "storage_subscription.type"
    message: "The subscription type must match the delivery configuration."
    expression: "(this.type == 1 && has(this.aws_sns)) || (this.type == 2 && has(this.google_pubsub)) || (this.type == 3 && has(this.azure_event_grid)) || (this.type == 4 && !has(this.aws_sns) && !has(this.google_pubsub) && !has(this.azure_event_grid))"
  };

  tilebox.v1.ID id = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  tilebox.v1.ID storage_location_id = 2;
  StorageSubscriptionType type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Notification delivery URL: HTTPS for the hosted API, HTTP for standalone on-orbit.
  // With a Unix-socket listener, on-orbit returns a relative path to use over that socket.
  string endpoint = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp created_at = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  AWSSNSStorageSubscription aws_sns = 7;
  GooglePubSubStorageSubscription google_pubsub = 8;
  AzureEventGridStorageSubscription azure_event_grid = 9;
}

// CreateStorageSubscriptionRequest registers notification delivery for a storage location. It enables the
// Tilebox webhook endpoint to receive object notifications from the provider. Infrastructure on the provider side
// must then be configured to send notifications to the returned endpoint.
message CreateStorageSubscriptionRequest {
  option (buf.validate.message).oneof = {
    fields: [
      "aws_sns",
      "google_pubsub",
      "azure_event_grid"
    ]
  };
  option (buf.validate.message).cel = {
    id: "create_storage_subscription_request.type"
    message: "The subscription type must match the delivery configuration."
    expression: "(this.type == 1 && has(this.aws_sns)) || (this.type == 2 && has(this.google_pubsub)) || (this.type == 3 && has(this.azure_event_grid)) || (this.type == 4 && !has(this.aws_sns) && !has(this.google_pubsub) && !has(this.azure_event_grid))"
  };

  tilebox.v1.ID storage_location_id = 1 [(buf.validate.field).required = true];
  StorageSubscriptionType type = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AWSSNSStorageSubscription aws_sns = 3;
  GooglePubSubStorageSubscription google_pubsub = 4;
  AzureEventGridStorageSubscription azure_event_grid = 5;
}

// ListStorageSubscriptionsRequest lists subscriptions for a storage location.
message ListStorageSubscriptionsRequest {
  tilebox.v1.ID storage_location_id = 1 [(buf.validate.field).required = true];
}

// NotifyObjectCreatedRequest sends a file-ready event to a TILEBOX_CLI subscription.
message NotifyObjectCreatedRequest {
  // Subscription through which to deliver the event. It must have type TILEBOX_CLI.
  tilebox.v1.ID storage_subscription_id = 1 [(buf.validate.field).required = true];
  // Path relative to the location root, using slash separators without dot or parent components. Must not include
  // a leading slash. For example, "subdir/file.txt" or "file.txt".
  string object_path = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 4096
  }];
  // Time the object was observed, absent when unavailable.
  google.protobuf.Timestamp event_time = 3;
}

// StorageSubscriptions contains notification subscriptions for a storage location.
message StorageSubscriptions {
  repeated StorageSubscription subscriptions = 1;
}

// StorageSubscriptionEvent is an object notification received for a storage location.
message StorageSubscriptionEvent {
  // Unique identifier of the received event.
  tilebox.v1.ID id = 1;
  // Object key relative to the location's root_prefix, or to the local directory root when no prefix is set.
  string object_key = 2 [(buf.validate.field).string = {
    min_bytes: 1
    max_bytes: 4096
  }];
  StorageEventType type = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Provider event time, absent when unavailable.
  google.protobuf.Timestamp event_time = 4;
  // Time Tilebox received the notification.
  google.protobuf.Timestamp received_at = 5;
  // Jobs triggered by this event.
  repeated TriggeredJob triggered_jobs = 6;
  // Subscription through which the event was received.
  tilebox.v1.ID storage_subscription_id = 7;
}

// ListStorageSubscriptionEventsRequest requests events received for a storage location.
message ListStorageSubscriptionEventsRequest {
  tilebox.v1.ID storage_location_id = 1 [(buf.validate.field).required = true];
  // Pagination in descending receipt order; the default and maximum limit is 100.
  tilebox.v1.Pagination page = 2 [features.field_presence = EXPLICIT];
}

// StorageSubscriptionEvents contains one page of received events, newest first.
message StorageSubscriptionEvents {
  repeated StorageSubscriptionEvent events = 1;
  // Pagination parameters for the next page, absent when there are no more events.
  tilebox.v1.Pagination next_page = 2 [features.field_presence = EXPLICIT];
}

// StorageLocations contains locations available to the caller.
message StorageLocations {
  repeated StorageLocation locations = 1;
}

// StorageEventType specifies the type of event that triggered the task.
enum StorageEventType {
  STORAGE_EVENT_TYPE_UNSPECIFIED = 0;
  STORAGE_EVENT_TYPE_CREATED = 1;
}

// TriggeredStorageEvent contains the details of the concrete event that triggered a storage event trigger.
message TriggeredStorageEvent {
  // The storage location that triggered the task
  tilebox.v1.ID storage_location_id = 1;
  // The type of the storage event, e.g. created
  StorageEventType type = 2;
  // Object key relative to the location root, with root_prefix removed.
  string location = 3;
}

// StorageLocationService manages storage locations, object access, and notifications.
service StorageLocationService {
  // ListStorageLocations lists locations available to the caller.
  rpc ListStorageLocations(google.protobuf.Empty) returns (StorageLocations);
  // GetStorageLocation gets a storage location by its ID.
  rpc GetStorageLocation(tilebox.v1.ID) returns (StorageLocation);
  // CreateStorageLocation registers an existing resource with optional object access.
  rpc CreateStorageLocation(CreateStorageLocationRequest) returns (StorageLocation);
  // UpdateStorageLocation changes the name or access settings. Subscriptions are unchanged.
  rpc UpdateStorageLocation(UpdateStorageLocationRequest) returns (StorageLocation);
  // DeleteStorageLocation removes the location and its subscriptions from Tilebox without deleting cloud resources.
  rpc DeleteStorageLocation(tilebox.v1.ID) returns (google.protobuf.Empty);

  // TestStorageAccess checks listing or reading without writing objects. Requires management permission.
  // Failures use RPC errors. Client-managed access cannot be tested by Tilebox.
  rpc TestStorageAccess(TestStorageAccessRequest) returns (google.protobuf.Empty);
  // CreateStorageAccessSession checks data-access permission and returns static or delegated credentials.
  // Returns FAILED_PRECONDITION for absent, anonymous, or client-managed access; configure those clients from the location.
  // Call again to renew. Responses use Cache-Control: no-store; errors omit provider secrets.
  rpc CreateStorageAccessSession(CreateStorageAccessSessionRequest) returns (StorageAccessSession);

  // CreateStorageSubscription registers notification delivery and returns the provider setup values.
  rpc CreateStorageSubscription(CreateStorageSubscriptionRequest) returns (StorageSubscription);
  // ListStorageSubscriptions lists notification subscriptions for a storage location.
  rpc ListStorageSubscriptions(ListStorageSubscriptionsRequest) returns (StorageSubscriptions);
  // GetStorageSubscription gets a subscription by its ID.
  rpc GetStorageSubscription(tilebox.v1.ID) returns (StorageSubscription);
  // DeleteStorageSubscription stops accepting notifications at its endpoint without deleting cloud resources.
  rpc DeleteStorageSubscription(tilebox.v1.ID) returns (google.protobuf.Empty);
  // ListStorageSubscriptionEvents lists received object notifications and the jobs they triggered.
  rpc ListStorageSubscriptionEvents(ListStorageSubscriptionEventsRequest) returns (StorageSubscriptionEvents);

  // NotifyObjectCreated delivers a storage event of a local storage location. Typically called by the Tilebox CLI
  // during the `tilebox storage-location watch` command. The subscription must be of type TILEBOX_CLI.
  rpc NotifyObjectCreated(NotifyObjectCreatedRequest) returns (google.protobuf.Empty);
}
